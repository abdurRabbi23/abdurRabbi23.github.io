<!DOCTYPE html>
<!-- 404.html: shown by GitHub Pages when someone opens an address that doesn't exist. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Md Abdur Rabbi</title>
  <meta name="robots" content="noindex">
  <!-- Absolute paths (starting with /) so this page works from any address -->
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
    })();
  </script>
</head>
<body>
  <main class="hero not-found">
    <div class="container">
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p class="intro">The page you're looking for doesn't exist.</p>
      <a class="btn btn-primary" href="/">Back to home</a>
    </div>
  </main>
</body>
</html>
